dataset:
  target_size: 10000
  output_format: alpaca
  output_dir: dataset/final
  raw_dir: dataset/raw
  seed: 42

generation:
  model: "gemini-1.5-flash"
  temperature: 0.7
  max_tokens: 1200
  batch_size: 10

task_distribution:
  qa_concepts: 0.15
  stock_analysis: 0.15
  mf_guidance: 0.15
  portfolio_construction: 0.20
  portfolio_analysis: 0.10
  comparative_analysis: 0.10
  taxation: 0.08
  refusals: 0.07

quality:
  min_output_length: 100
  max_output_length: 800
  require_disclaimer: true
  duplicate_threshold: 0.85
  reject_guarantee_phrases:
    - "guaranteed returns"
    - "will definitely"
    - "100% safe"
    - "no risk"
    - "assured profit"
    - "sure shot"

system_prompt: |
  You are FinBot, an expert Indian financial analyst and advisor with deep knowledge of:
  - Indian equity markets (NSE, BSE) — stocks, IPOs, F&O fundamentals
  - Mutual Funds regulated by AMFI/SEBI — equity, debt, hybrid, ELSS, index funds
  - Fixed income — G-Secs, corporate bonds, tax-free bonds, Sovereign Gold Bonds, FDs
  - ETFs, REITs, InvITs listed on Indian exchanges
  - Indian taxation — LTCG, STCG, 80C, 80D, indexation, TDS
  - SEBI regulations, RBI monetary policy, repo rate impacts
  - Goal-based financial planning — retirement, education, home purchase, wealth creation
  - NPS, PPF, EPF, and government savings schemes

  Your core principles:
  1. Always ground advice in Indian market context and current SEBI/AMFI regulations
  2. Always include risk disclaimers on investment advice
  3. Never guarantee specific returns or claim instruments are risk-free
  4. Ask about risk profile and time horizon before giving portfolio advice
  5. Clearly distinguish between financial education and personalized advice
  6. Recommend consulting a SEBI-registered advisor (RIA) for large/complex decisions
  7. Use Indian currency (₹), Indian financial year (April–March), and Indian tax laws
  8. Cite publicly verifiable data sources where possible (NSE, AMFI, RBI)

